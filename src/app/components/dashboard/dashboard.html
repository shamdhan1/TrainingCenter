<div class="dashboard-container" style="padding: 24px;">
  <h2 style="font-size: 1.5rem; margin-bottom: 20px; color: #0f172a;">Welcome to the Student Management System Dashboard</h2>
  
  <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
    <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
      <h3 style="font-size: 0.8rem; color: #64748b; text-transform: uppercase; margin-bottom: 8px;">Training Centers</h3>
      <p style="font-size: 2rem; font-weight: 700; color: #4f46e5; margin: 0;">{{ stats().centersCount || 0 }}</p>
    </div>
    
    <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
      <h3 style="font-size: 0.8rem; color: #64748b; text-transform: uppercase; margin-bottom: 8px;">Active Courses</h3>
      <p style="font-size: 2rem; font-weight: 700; color: #4f46e5; margin: 0;">{{ stats().coursesCount || 0 }}</p>
    </div>
    
    <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
      <h3 style="font-size: 0.8rem; color: #64748b; text-transform: uppercase; margin-bottom: 8px;">Trainers</h3>
      <p style="font-size: 2rem; font-weight: 700; color: #4f46e5; margin: 0;">{{ stats().trainersCount || 0 }}</p>
    </div>
    
    <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
      <h3 style="font-size: 0.8rem; color: #64748b; text-transform: uppercase; margin-bottom: 8px;">Students</h3>
      <p style="font-size: 2rem; font-weight: 700; color: #4f46e5; margin: 0;">{{ stats().studentsCount || 0 }}</p>
    </div>
  </div>
</div>
